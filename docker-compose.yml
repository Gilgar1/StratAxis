version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: strataxis-db
    environment:
      POSTGRES_USER: strataxis_user
      POSTGRES_PASSWORD: strataxis_password
      POSTGRES_DB: strataxis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: strataxis-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://strataxis_user:strataxis_password@db:5432/strataxis
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
