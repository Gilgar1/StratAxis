[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "sqlmodel.*",
    "pandas.*",
    "numpy.*",
    "sklearn.*",
    "bs4.*",
    "selenium.*",
    "pytesseract.*",
    "pdf2image.*",
    "prophet.*",
    "jose.*",
    "passlib.*",
    "slowapi.*"
]
ignore_missing_imports = true
